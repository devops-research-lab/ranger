name: CI
on:
  push: null
env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard
    -Dmaven.wagon.http.retryHandler.count=3
jobs:
  build-8:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Cache for maven dependencies
      uses: actions/cache@v4
      with:
        path: '~/.m2/repository/*/*/*

          !~/.m2/repository/org/apache/ranger

          '
        key: maven-repo-${{ hashFiles('**/pom.xml') }}
        restore-keys: 'maven-repo-

          '
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: temurin
    - name: build (8)
      run: mvn -T 8 clean verify --no-transfer-progress -B -V
      id: _bre_build_8
    - name: Cache for maven dependencies
      uses: actions/cache/restore@v4
      with:
        path: '~/.m2/repository/*/*/*

          !~/.m2/repository/org/apache/ranger

          '
        key: maven-repo-${{ hashFiles('**/pom.xml') }}
        restore-keys: 'maven-repo-

          '
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: temurin
    - name: build (11)
      run: mvn -T 8 clean verify -pl '!knox-agent' --no-transfer-progress -B -V
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: target-11
        path: target/*
    - name: Copy artifacts for docker build
      run: 'cp ranger-*.tar.gz dev-support/ranger-docker/dist

        cp version dev-support/ranger-docker/dist

        '
      if: '!cancelled() && steps._bre_build_8.conclusion == ''success'''
    - name: Cache downloaded archives
      uses: actions/cache@v4
      with:
        path: dev-support/ranger-docker/downloads
        key: ${{ runner.os }}-ranger-downloads-${{ hashFiles('dev-support/ranger-docker/.env') }}
        restore-keys: '${{ runner.os }}-ranger-downloads-

          '
      if: '!cancelled() && steps._bre_build_8.conclusion == ''success'''
    - name: Run download-archives.sh
      run: 'cd dev-support/ranger-docker

        ./download-archives.sh hadoop hive hbase kafka knox ozone

        '
      if: '!cancelled() && steps._bre_build_8.conclusion == ''success'''
    - name: Clean up Docker space
      run: docker system prune --all --force --volumes
      if: '!cancelled() && steps._bre_build_8.conclusion == ''success'''
    - name: Build all ranger-service images
      run: 'cd dev-support/ranger-docker

        docker compose -f docker-compose.ranger-base.yml build

        export DOCKER_BUILDKIT=1

        export COMPOSE_DOCKER_CLI_BUILD=1

        export RANGER_DB_TYPE=postgres

        docker compose \

        -f docker-compose.ranger-${RANGER_DB_TYPE}.yml \

        -f docker-compose.ranger.yml \

        -f docker-compose.ranger-usersync.yml \

        -f docker-compose.ranger-tagsync.yml \

        -f docker-compose.ranger-kms.yml \

        -f docker-compose.ranger-hadoop.yml \

        -f docker-compose.ranger-hbase.yml \

        -f docker-compose.ranger-kafka.yml \

        -f docker-compose.ranger-hive.yml \

        -f docker-compose.ranger-knox.yml \

        -f docker-compose.ranger-ozone.yml build

        '
      if: '!cancelled() && steps._bre_build_8.conclusion == ''success'''
    - name: Bring up containers
      run: 'cd dev-support/ranger-docker

        ./scripts/ozone-plugin-docker-setup.sh

        export RANGER_DB_TYPE=postgres

        docker compose \

        -f docker-compose.ranger-${RANGER_DB_TYPE}.yml \

        -f docker-compose.ranger.yml \

        -f docker-compose.ranger-usersync.yml \

        -f docker-compose.ranger-tagsync.yml \

        -f docker-compose.ranger-kms.yml \

        -f docker-compose.ranger-hadoop.yml \

        -f docker-compose.ranger-hbase.yml \

        -f docker-compose.ranger-kafka.yml \

        -f docker-compose.ranger-hive.yml \

        -f docker-compose.ranger-knox.yml \

        -f docker-compose.ranger-ozone.yml up -d

        '
      if: '!cancelled() && steps._bre_build_8.conclusion == ''success'''
    - name: Check status of containers and remove them
      run: "sleep 60\ncontainers=(ranger ranger-zk ranger-solr ranger-postgres ranger-usersync ranger-tagsync\
        \ ranger-kms ranger-hadoop ranger-hbase ranger-kafka ranger-hive ranger-knox ozone-om ozone-scm\
        \ ozone-datanode);\nflag=true;\nfor container in \"${containers[@]}\"; do\n    if [[ $(docker\
        \ inspect -f '{{.State.Running}}' $container 2>/dev/null) == \"true\" ]]; then\n        echo \"\
        Container $container is running!\";\n    else\n        flag=false;\n        echo \"Container $container\
        \ is NOT running!\";\n    fi\ndone\n\nif [[ $flag == true ]]; then\n    echo \"All required containers\
        \ are up and running\";\n    docker stop $(docker ps -q) && docker rm $(docker ps -aq);\nelse\n\
        \    docker stop $(docker ps -q) && docker rm $(docker ps -aq);\n    exit 1;\nfi\n"
      if: '!cancelled() && steps._bre_build_8.conclusion == ''success'''
